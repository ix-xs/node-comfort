name: Release

# Publishes the GitHub release of a version once its tag exists: when the tag
# is pushed, or at the next push to main if the tag came first.
#
# The release is published in the name of whoever owns the RELEASE_TOKEN secret
# (a personal access token with write access to the contents of this
# repository). Without that secret, nothing is published.
on:
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Create the release of the current version, if it is tagged and has none
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: node scripts/github-release.js
