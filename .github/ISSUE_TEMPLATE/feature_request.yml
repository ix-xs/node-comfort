name: ✨ Feature request
description: Suggest a helper or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: The situation where you needed it, and what you use today (another package, custom code...).
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: How you would like to call it.
      render: js
  - type: checkboxes
    id: rules
    attributes:
      label: Checklist
      options:
        - label: It can be built with Node.js native modules only (no dependency).
          required: true
