name: 🐛 Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem.
      render: js
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: node-comfort version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: "Node 24.14, Windows 11"
    validations:
      required: true
